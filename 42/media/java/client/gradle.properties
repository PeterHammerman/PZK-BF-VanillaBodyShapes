# Edit these paths for your machine, then run:  gradle build
# Output: build/libs/client.jar  (the path mod.info points at)

# ZombieBuddy.jar (from the ZombieBuddy mod folder or the game directory)
zombieBuddyJar=H:/Program Files (x86)/SteamLibrary/steamapps/common/ProjectZomboid/ZombieBuddy.jar

# Folder containing the game's jars (projectzomboid.jar, kahlua, joml, lwjgl ...)
pzJavaDir=H:/Program Files (x86)/SteamLibrary/steamapps/common/ProjectZomboid
enableAvatarPatch=true
# --- Gradle / JDK compatibility -------------------------------------------------
# "Unsupported class file major version 70" = Gradle older than 9.4.0 running on JDK 26.
# Fix 1: use Gradle 9.4.0 or newer.
# Fix 2: run Gradle on JDK 17-25 by uncommenting the next line. The JDK must be at least
#        as new as the one the game's jars were built with.
#org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21
